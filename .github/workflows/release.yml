name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # .nvmrc pins Node 24, which ships npm 11+ (required for npm
          # Trusted Publishing / OIDC).
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages

      # Opens a "Version Packages" PR while changesets are pending.
      # When that PR is merged, runs `pnpm release` to publish to npm.
      #
      # Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN secret.
      # Each package must have a Trusted Publisher configured at
      #   https://www.npmjs.com/package/@web-ai-sdk/<name>/access
      # pointing at this repo + workflow filename (release.yml).
      # The `id-token: write` permission above lets the npm CLI mint
      # a short-lived registry token from the GitHub OIDC token.
      - uses: changesets/action@v1.9.0
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          # A PAT (not the default GITHUB_TOKEN) so the opened "Version
          # Packages" PR triggers the CI workflow. GitHub intentionally
          # suppresses workflow runs for events created by GITHUB_TOKEN.
          # Passed via the action input (not step-level env) so it is not
          # exposed to the publish/version subprocesses.
          github-token: ${{ secrets.CHANGESETS_TOKEN }}
