name: Deploy MCP

on:
  workflow_dispatch:

concurrency:
  group: mcp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: mcp-production
      url: https://mcp.web-ai-sdk.dev/mcp
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify documentation MCP Worker
        run: |
          pnpm --filter @web-ai-sdk-apps/mcp build
          pnpm --filter @web-ai-sdk-apps/mcp typecheck
          pnpm --filter @web-ai-sdk-apps/mcp test

      - name: Deploy documentation MCP Worker
        run: pnpm --filter @web-ai-sdk-apps/mcp deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
