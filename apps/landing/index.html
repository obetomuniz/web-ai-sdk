<!doctype html>
<html lang="en" class="density-tight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-ai-sdk · building blocks for the Web's built-in AI</title>
    <meta
      name="description"
      content="Building blocks for the Web's built-in AI APIs. Composable. No runtime deps. Just lifecycle, streaming, and AbortSignals. Vanilla TypeScript by default, with optional React hooks."
    />

    <!-- Brand mark; warm-black frame with a cream "ai" in angle brackets and a flame i-tittle. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical points at the custom-domain root; the Pages preview and any
         project-Pages mirror are not the canonical URL. -->
    <link rel="canonical" href="https://web-ai-sdk.dev/" />

    <!-- Sitemap discovery for crawlers that don't read robots.txt. -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Structured data: WebSite + SoftwareSourceCode. Google's AI Optimization
         Guide says JSON-LD isn't required for AI search but recommends it as
         part of overall SEO. The npm coordinates make this discoverable as a
         library, not just a homepage. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://web-ai-sdk.dev/#website",
            "name": "web-ai-sdk",
            "url": "https://web-ai-sdk.dev/",
            "description": "Building blocks for the Web's built-in AI APIs. Composable. No runtime deps. Just lifecycle, streaming, and AbortSignals.",
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareSourceCode",
            "@id": "https://web-ai-sdk.dev/#sourcecode",
            "name": "web-ai-sdk",
            "description": "Headless wrappers for the Web's built-in AI APIs (Prompt, Summarizer, Translator, Detector, WebMCP). Vanilla TypeScript by default, with optional React hooks.",
            "url": "https://web-ai-sdk.dev/",
            "codeRepository": "https://github.com/obetomuniz/web-ai-sdk",
            "programmingLanguage": ["TypeScript", "JavaScript"],
            "license": "https://opensource.org/licenses/MIT",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web",
            "author": {
              "@type": "Person",
              "name": "Beto Muniz",
              "url": "https://github.com/obetomuniz"
            },
            "mainEntityOfPage": { "@id": "https://web-ai-sdk.dev/#website" }
          }
        ]
      }
    </script>

    <!-- Social card; 1200×630 hero shot generated by apps/landing/scripts/build-og-image.mjs.
         Absolute URLs are required — most scrapers (X/LinkedIn/Slack/iMessage) won't resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web-ai-sdk.dev/" />
    <meta property="og:site_name" content="web-ai-sdk" />
    <meta property="og:title" content="web-ai-sdk · Building blocks for the Web's built-in AI" />
    <meta property="og:description" content="Composable. No runtime deps. Just lifecycle, streaming, and AbortSignals. Vanilla TypeScript by default, with optional React hooks." />
    <meta property="og:image" content="https://web-ai-sdk.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="web-ai-sdk — npm install @web-ai-sdk/all" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="web-ai-sdk · Building blocks for the Web's built-in AI" />
    <meta name="twitter:description" content="Composable. No runtime deps. Just lifecycle, streaming, and AbortSignals." />
    <meta name="twitter:image" content="https://web-ai-sdk.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
